name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # 规避 Windows 控制台 GBK 编码问题
  PYTHONUTF8: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q -m "not integration"

      - name: Lint
        run: uv run ruff check src tests

      - name: Check dependencies
        run: uv run deptry .
